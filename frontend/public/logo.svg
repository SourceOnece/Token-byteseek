<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ByteSeek</title>
  <desc id="desc">Bauhaus composition: red circle, blue square and yellow triangle on paper.</desc>

  <!-- 纸色底板 + 墨色硬边 -->
  <rect x="18" y="18" width="476" height="476" fill="#F4F0E6" stroke="#141414" stroke-width="24"/>

  <!-- 蓝色方块（左下，压底） -->
  <rect x="96" y="230" width="186" height="186" fill="#1450A3"/>

  <!-- 红色圆（右上，叠压方块一角） -->
  <circle cx="312" cy="196" r="118" fill="#E1251B"/>

  <!-- 黄色三角（右下，向上） -->
  <path d="M 322 416 L 414 258 L 506 416 Z" fill="#FFCC00" stroke="#141414" stroke-width="18" transform="translate(-72 0)"/>

  <!-- 墨色斜杠，贯穿构图 -->
  <rect x="230" y="60" width="26" height="392" fill="#141414" transform="rotate(24 243 256)"/>
</svg>
